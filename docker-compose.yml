services:
  api:
    build: .
    container_name: melon_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: melon_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-melon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-melon_backend}
    ports:
      - "5432:5432"
    volumes:
      - melon_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-melon} -d ${POSTGRES_DB:-melon_backend}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  melon_pg_data:
